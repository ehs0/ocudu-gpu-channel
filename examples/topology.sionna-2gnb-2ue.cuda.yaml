# Sionna RT-driven 2-gNB / 2-UE topology.
#
# Sionna runs as an external low-rate control-plane process. It replaces the
# placeholder TDL below through --control-endpoint; the C++/CUDA broker keeps
# the real-time IQ path, and OCUDU itself remains unchanged.
#
# Every gNB/UE pair has a directed DL and UL edge, plus UE<->UE leakage
# (10 total). At each UE receiver, the CUDA backend superposes two gNB
# downlinks and the other UE's crosstalk edge; at each gNB it superposes both
# UE uplinks. Serving, inter-cell interference, and crosstalk are therefore
# represented uniformly. The bridge uses the canonical
# control key "from>to:sionna_rt" for each edge.
runtime:
  backend: cuda
  gpu_device: 0
  batch_samples: 23040
  queue_samples: 2457600
devices:
  - id: gnb0
    role: gnb
    sample_rate_hz: 23040000
    tx_endpoint: tcp://127.0.0.1:3000
    rx_endpoint: tcp://*:3001
  - id: gnb1
    role: gnb
    sample_rate_hz: 23040000
    tx_endpoint: tcp://127.0.0.1:3002
    rx_endpoint: tcp://*:3003
  - id: ue0
    role: ue
    sample_rate_hz: 23040000
    tx_endpoint: tcp://127.0.0.1:3101
    rx_endpoint: tcp://*:3100
  - id: ue1
    role: ue
    sample_rate_hz: 23040000
    tx_endpoint: tcp://127.0.0.1:3103
    rx_endpoint: tcp://*:3102
links:
  - from: gnb0
    to: ue0
    model: sionna_rt
  - from: gnb0
    to: ue1
    model: sionna_rt
  - from: gnb1
    to: ue0
    model: sionna_rt
  - from: gnb1
    to: ue1
    model: sionna_rt
  - from: ue0
    to: gnb0
    model: sionna_rt
  - from: ue0
    to: gnb1
    model: sionna_rt
  - from: ue1
    to: gnb0
    model: sionna_rt
  - from: ue1
    to: gnb1
    model: sionna_rt
  - from: ue0
    to: ue1
    model: sionna_rt
  - from: ue1
    to: ue0
    model: sionna_rt
models:
  sionna_rt:
    chain:
      # Required routing anchor for runtime profile_swap. The bridge replaces
      # this tap before/while IQ flows; no statistical fading is added because
      # the instantaneous complex coefficients already come from Sionna.
      - type: tdl
        taps:
          - delay_samples: 0.0
            gain_db: -100.0
            phase_rad: 0.0
